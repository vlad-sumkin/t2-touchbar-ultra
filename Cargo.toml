[workspace]
members = [".", "settings-ui"]
resolver = "2"

[package]
name = "t2-touchbar-ultra"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Dark-first Touch Bar daemon for Apple T2 Macs with status dashboard, predictive typing, word lookup, clipboard history, and MechPad keyboard haptics"

[lib]
name = "t2_touchbar_ultra"
path = "src/lib.rs"

[[bin]]
name = "t2-touchbar-ultra"
path = "src/main.rs"

[dependencies]
ab_glyph = { version = "0.2.32", features = ["variable-fonts"] }
anyhow = "1.0"
drm = "0.14"
freetype-rs = "0.38"
input = "0.9"
input-linux = "0.7"
input-linux-sys = "0.9"
libc = "0.2"
resvg = "0.49"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
toml = { version = "0.8", features = ["preserve_order"] }
zbus = "5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
