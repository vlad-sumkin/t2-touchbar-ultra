[package]
name = "t2-touchbar-ultra-settings"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "GTK4 + Libadwaita settings interface for T2 Touchbar Ultra"

[[bin]]
name = "t2-touchbar-ultra-settings"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }
gtk4 = { version = "0.9", features = ["v4_12"] }
t2-touchbar-ultra = { path = ".." }
toml = { version = "0.8", features = ["preserve_order"] }
